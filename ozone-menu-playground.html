<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroArch Ozone Menu Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #2D2D2D;
    --sidebar-bg: #333333;
    --sidebar-grad-dark: #2E2E2E;
    --header-height: 56px;
    --footer-height: 50px;
    --sidebar-width: 280px;
    --sidebar-collapsed: 60px;
    --entry-height: 46px;
    --entry-border: #51514F;
    --text: #FFFFFF;
    --text-sublabel: #9F9FA1;
    --text-value: #00FFC5;
    --selection-fill: #212227;
    --selection-border: #2DA3CB;
    --cursor-0: #198AC6;
    --cursor-1: #89F1F2;
    --separator: rgba(255,255,255,0.15);
  }

  body {
    background: #1a1a1a;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top toolbar */
  .toolbar {
    background: #1a1a1a;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #444;
    flex-shrink: 0;
    min-height: 44px;
  }
  .toolbar-title {
    font-size: 13px;
    font-weight: 600;
    color: #aaa;
    margin-right: auto;
  }
  .toolbar-btn {
    background: #383838;
    border: 1px solid #555;
    color: #ddd;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .toolbar-btn:hover { background: #4a4a4a; }
  .toolbar-btn.active { background: var(--cursor-0); color: #fff; border-color: var(--cursor-0); }
  .toolbar-label {
    font-size: 11px;
    color: #888;
  }

  /* Main sim container */
  .sim-container {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Ozone frame */
  .ozone {
    flex: 1;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Header */
  .ozone-header {
    height: var(--header-height);
    display: flex;
    align-items: center;
    padding: 0 24px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .ozone-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--separator);
  }
  .header-icon {
    width: 28px;
    height: 28px;
    margin-right: 12px;
    opacity: 0.9;
  }
  .header-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-right {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-sublabel);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-battery {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .battery-icon {
    width: 20px;
    height: 10px;
    border: 1.5px solid var(--text-sublabel);
    border-radius: 2px;
    position: relative;
  }
  .battery-icon::after {
    content: '';
    position: absolute;
    right: -4px;
    top: 2px;
    width: 2px;
    height: 4px;
    background: var(--text-sublabel);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    height: 100%;
    width: 75%;
    background: var(--text-sublabel);
    border-radius: 1px;
  }

  /* Body */
  .ozone-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Sidebar */
  .ozone-sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    transition: width 0.25s ease;
  }
  .ozone-sidebar::before,
  .ozone-sidebar::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 20px;
    z-index: 1;
    pointer-events: none;
  }
  .ozone-sidebar::before {
    top: 0;
    background: linear-gradient(to bottom, var(--sidebar-bg), var(--sidebar-grad-dark));
  }
  .ozone-sidebar::after {
    bottom: 0;
    background: linear-gradient(to top, var(--sidebar-bg), var(--sidebar-grad-dark));
  }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 0;
    scrollbar-width: none;
  }
  .sidebar-scroll::-webkit-scrollbar { display: none; }

  .sidebar-separator {
    height: 1px;
    background: var(--entry-border);
    margin: 8px 20px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    height: 40px;
    padding: 0 20px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
    gap: 12px;
    user-select: none;
  }
  .sidebar-item:hover {
    background: rgba(255,255,255,0.04);
  }
  .sidebar-item.active {
    background: var(--selection-fill);
  }
  .sidebar-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 3px;
    background: var(--cursor-0);
    border-radius: 0 2px 2px 0;
  }
  .sidebar-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    font-size: 16px;
  }
  .sidebar-item.active .sidebar-icon { opacity: 1; }
  .sidebar-label {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-item.active .sidebar-label {
    color: var(--text);
    font-weight: 600;
  }
  .sidebar-sublabel {
    font-size: 11px;
    color: var(--text-sublabel);
    padding: 4px 20px 0 56px;
  }

  /* Content area */
  .ozone-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Breadcrumb */
  .breadcrumb {
    padding: 12px 28px 0;
    font-size: 12px;
    color: var(--text-sublabel);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 0;
  }
  .breadcrumb:empty { padding: 0; }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--text); }
  .breadcrumb .bc-sep { color: #666; cursor: default; }
  .breadcrumb .bc-sep:hover { color: #666; }

  .content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: #555 transparent;
  }
  .content-scroll::-webkit-scrollbar { width: 4px; }
  .content-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

  .content-entry {
    display: flex;
    align-items: center;
    height: var(--entry-height);
    padding: 0 28px;
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
    gap: 12px;
  }
  .content-entry:hover {
    background: rgba(255,255,255,0.03);
  }
  .content-entry.selected {
    background: var(--selection-fill);
  }
  .content-entry.selected::before {
    content: '';
    position: absolute;
    inset: 2px 8px;
    border: 2px solid var(--selection-border);
    border-radius: 6px;
    pointer-events: none;
    animation: cursorPulse 2s ease-in-out infinite;
  }
  @keyframes cursorPulse {
    0%, 100% { border-color: var(--cursor-0); }
    50% { border-color: var(--cursor-1); }
  }

  .entry-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    opacity: 0.6;
  }
  .content-entry.selected .entry-icon { opacity: 1; }

  .entry-text {
    flex: 1;
    min-width: 0;
  }
  .entry-label {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-sublabel {
    font-size: 11px;
    color: var(--text-sublabel);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .entry-value {
    font-size: 13px;
    color: var(--text-value);
    flex-shrink: 0;
    margin-left: 12px;
  }
  .entry-arrow {
    color: var(--text-sublabel);
    font-size: 12px;
    flex-shrink: 0;
    margin-left: 4px;
  }

  .entry-divider {
    height: 1px;
    background: var(--entry-border);
    margin: 4px 28px;
    opacity: 0.3;
  }

  .content-group-label {
    padding: 16px 28px 6px;
    font-size: 11px;
    color: var(--cursor-0);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-sublabel);
    font-size: 14px;
    gap: 8px;
  }
  .empty-state .empty-icon { font-size: 32px; opacity: 0.4; }

  /* Footer */
  .ozone-footer {
    height: var(--footer-height);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 24px;
    flex-shrink: 0;
    position: relative;
  }
  .ozone-footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--separator);
  }
  .footer-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-sublabel);
  }
  .footer-key {
    background: #444;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    border: 1px solid #555;
  }

  /* Prompt panel */
  .prompt-panel {
    width: 380px;
    background: #1e1e1e;
    border-left: 1px solid #444;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .prompt-header {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .copy-btn {
    background: var(--cursor-0);
    border: none;
    color: #fff;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: #1580b5; }
  .prompt-body {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    color: #ccc;
    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
  }
  .prompt-body code {
    background: #333;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 12px;
  }

  /* Info tooltip */
  .info-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(25, 138, 198, 0.15);
    color: var(--cursor-0);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 8px;
    text-transform: uppercase;
  }

  /* Search */
  .search-bar {
    padding: 8px 28px;
    flex-shrink: 0;
  }
  .search-input {
    width: 100%;
    background: #383838;
    border: 1px solid #555;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
    outline: none;
  }
  .search-input:focus { border-color: var(--cursor-0); }
  .search-input::placeholder { color: #777; }
  .search-count {
    font-size: 11px;
    color: var(--text-sublabel);
    padding: 2px 28px 0;
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">RetroArch Ozone Menu Simulator</span>
  <span class="toolbar-label">Search:</span>
  <input type="text" id="globalSearch" class="search-input" placeholder="Filter menu items..." style="width:220px;padding:3px 10px;font-size:12px;">
  <button class="toolbar-btn" id="btnExpand" onclick="expandAll()">Expand All</button>
  <button class="toolbar-btn" id="btnCollapse" onclick="collapseAll()">Collapse</button>
</div>

<div class="sim-container">
  <div class="ozone">
    <!-- Header -->
    <div class="ozone-header">
      <svg class="header-icon" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <span class="header-title" id="headerTitle">Main Menu</span>
      <div class="header-right">
        <span id="headerClock"></span>
        <div class="header-battery"><div class="battery-icon"><div class="battery-fill"></div></div><span>75%</span></div>
      </div>
    </div>

    <!-- Body -->
    <div class="ozone-body">
      <!-- Sidebar -->
      <div class="ozone-sidebar">
        <div class="sidebar-scroll" id="sidebarScroll"></div>
      </div>

      <!-- Content -->
      <div class="ozone-content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-scroll" id="contentScroll"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="ozone-footer">
      <div class="footer-hint"><span class="footer-key">A</span> OK</div>
      <div class="footer-hint"><span class="footer-key">B</span> Back</div>
      <div class="footer-hint"><span class="footer-key">&uarr;&darr;</span> Navigate</div>
      <div class="footer-hint"><span class="footer-key">L/R</span> Switch Tab</div>
      <div class="footer-hint"><span class="footer-key">Y</span> Search</div>
    </div>
  </div>

  <!-- Prompt output -->
  <div class="prompt-panel">
    <div class="prompt-header">
      <span>Menu Path Output</span>
      <button class="copy-btn" onclick="copyPrompt()">Copy</button>
    </div>
    <div class="prompt-body" id="promptBody">
      <p>Click on any menu item to see its full path and context. Navigate through the sidebar tabs and drill into sub-menus to explore the complete Ozone menu structure.</p>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════════════
// STATE & NAVIGATION
// ═══════════════════════════════════════════════════

const state = {
  activeTab: "Main Menu",
  navStack: [],        // breadcrumb: [{label, items}]
  selectedIndex: 0,
  searchQuery: ""
};

function currentItems() {
  if (state.navStack.length > 0) {
    return state.navStack[state.navStack.length - 1].items;
  }
  return MENU_DATA[state.activeTab]?.items || [];
}

function filteredItems() {
  const items = currentItems();
  const q = state.searchQuery.toLowerCase().trim();
  if (!q) return items;
  return items.filter(i =>
    i.label.toLowerCase().includes(q) ||
    (i.sublabel && i.sublabel.toLowerCase().includes(q)) ||
    (i.value && i.value.toLowerCase().includes(q))
  );
}

// ═══════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════

function renderSidebar() {
  const el = document.getElementById('sidebarScroll');
  const tabs = Object.keys(MENU_DATA);
  let html = '';

  // System tabs (Main Menu, Settings)
  tabs.slice(0, 2).forEach(tab => {
    const d = MENU_DATA[tab];
    html += `<div class="sidebar-item ${state.activeTab === tab ? 'active' : ''}" onclick="selectTab('${tab}')">
      <span class="sidebar-icon">${d.icon}</span>
      <span class="sidebar-label">${tab}</span>
      ${d.badge ? `<span class="info-badge">${d.badge}</span>` : ''}
    </div>`;
  });

  html += '<div class="sidebar-separator"></div>';

  // Content tabs
  tabs.slice(2).forEach(tab => {
    const d = MENU_DATA[tab];
    html += `<div class="sidebar-item ${state.activeTab === tab ? 'active' : ''}" onclick="selectTab('${tab}')">
      <span class="sidebar-icon">${d.icon}</span>
      <span class="sidebar-label">${tab}</span>
      ${d.badge ? `<span class="info-badge">${d.badge}</span>` : ''}
    </div>`;
  });

  el.innerHTML = html;
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  if (state.navStack.length === 0) {
    el.innerHTML = '';
    return;
  }
  let html = `<span onclick="navigateToRoot()">${state.activeTab}</span>`;
  state.navStack.forEach((crumb, i) => {
    html += `<span class="bc-sep">›</span>`;
    if (i < state.navStack.length - 1) {
      html += `<span onclick="navigateTo(${i})">${crumb.label}</span>`;
    } else {
      html += `<span style="color:var(--text)">${crumb.label}</span>`;
    }
  });
  el.innerHTML = html;
}

function renderContent() {
  const el = document.getElementById('contentScroll');
  const items = filteredItems();
  const tabData = MENU_DATA[state.activeTab];

  // Update header title
  const title = state.navStack.length > 0
    ? state.navStack[state.navStack.length - 1].label
    : state.activeTab;
  document.getElementById('headerTitle').textContent = title;

  if (items.length === 0) {
    const msg = tabData?.emptyMessage || "No items to display.";
    el.innerHTML = `<div class="empty-state">
      <span class="empty-icon">${tabData?.icon || "📭"}</span>
      <span>${msg}</span>
    </div>`;
    return;
  }

  if (state.selectedIndex >= items.length) state.selectedIndex = 0;

  let html = '';
  items.forEach((item, i) => {
    const isSelected = i === state.selectedIndex;
    const hasChildren = item.children && item.children.length > 0;

    html += `<div class="content-entry ${isSelected ? 'selected' : ''}"
      onclick="selectEntry(${i})" ondblclick="activateEntry(${i})">
      <span class="entry-icon">${item.icon || '•'}</span>
      <div class="entry-text">
        <div class="entry-label">${item.label}</div>
        ${item.sublabel ? `<div class="entry-sublabel">${item.sublabel}</div>` : ''}
      </div>
      ${item.badge ? `<span class="info-badge">${item.badge}</span>` : ''}
      ${item.value ? `<span class="entry-value">${item.value}</span>` : ''}
      ${hasChildren ? '<span class="entry-arrow">▸</span>' : ''}
    </div>`;
  });
  el.innerHTML = html;
}

function updatePrompt() {
  const el = document.getElementById('promptBody');
  const items = filteredItems();
  const selected = items[state.selectedIndex];

  let pathParts = [state.activeTab];
  state.navStack.forEach(c => pathParts.push(c.label));
  if (selected) pathParts.push(selected.label);

  const fullPath = pathParts.join(' → ');
  const tabData = MENU_DATA[state.activeTab];
  const totalItems = currentItems().length;

  let html = `<p><strong>Current Path:</strong></p>
<p><code>${fullPath}</code></p>`;

  if (selected) {
    html += `<p style="margin-top:12px"><strong>Selected Item:</strong> ${selected.label}</p>`;
    if (selected.sublabel) html += `<p style="color:var(--text-sublabel)">${selected.sublabel}</p>`;
    if (selected.value) html += `<p>Current value: <code>${selected.value}</code></p>`;
    if (selected.badge) html += `<p>Requires: <code>${selected.badge}</code> compile flag</p>`;
    if (selected.children) html += `<p style="color:var(--text-value)">→ Has ${selected.children.length} sub-item${selected.children.length !== 1 ? 's' : ''} (double-click to enter)</p>`;
  }

  html += `<hr style="border-color:#444;margin:16px 0">
<p><strong>Tab:</strong> ${state.activeTab} ${tabData?.badge ? `(${tabData.badge})` : ''}</p>
<p><strong>Depth:</strong> ${state.navStack.length} level${state.navStack.length !== 1 ? 's' : ''} deep</p>
<p><strong>Items at this level:</strong> ${totalItems}</p>`;

  if (state.searchQuery) {
    html += `<p><strong>Filter:</strong> "${state.searchQuery}" (${items.length} match${items.length !== 1 ? 'es' : ''})</p>`;
  }

  // Generate prompt text
  html += `<hr style="border-color:#444;margin:16px 0">
<p><strong>Prompt:</strong></p>
<p style="background:#282828;padding:12px;border-radius:6px;line-height:1.6">`;

  if (selected && selected.children) {
    html += `In RetroArch's Ozone menu, navigate to <code>${fullPath}</code>. This sub-menu contains ${selected.children.length} option${selected.children.length !== 1 ? 's' : ''}: ${selected.children.slice(0,5).map(c => c.label).join(', ')}${selected.children.length > 5 ? ', ...' : ''}.`;
  } else if (selected && selected.value) {
    html += `In RetroArch's Ozone menu at <code>${pathParts.slice(0,-1).join(' → ')}</code>, the setting "${selected.label}" is currently set to <code>${selected.value}</code>.`;
  } else if (selected) {
    html += `In RetroArch's Ozone menu, select <code>${fullPath}</code>.`;
  } else {
    html += `In RetroArch's Ozone menu, the "${state.activeTab}" tab contains ${totalItems} item${totalItems !== 1 ? 's' : ''}.`;
  }
  html += '</p>';

  el.innerHTML = html;
}

function updateAll() {
  renderSidebar();
  renderBreadcrumb();
  renderContent();
  updatePrompt();
}

// ═══════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════

function selectTab(tab) {
  state.activeTab = tab;
  state.navStack = [];
  state.selectedIndex = 0;
  state.searchQuery = '';
  document.getElementById('globalSearch').value = '';
  updateAll();
}

function selectEntry(i) {
  state.selectedIndex = i;
  renderContent();
  updatePrompt();
}

function activateEntry(i) {
  const items = filteredItems();
  const item = items[i];
  if (item && item.children && item.children.length > 0) {
    state.navStack.push({ label: item.label, items: item.children });
    state.selectedIndex = 0;
    state.searchQuery = '';
    document.getElementById('globalSearch').value = '';
    updateAll();
  }
}

function navigateToRoot() {
  state.navStack = [];
  state.selectedIndex = 0;
  updateAll();
}

function navigateTo(index) {
  state.navStack = state.navStack.slice(0, index + 1);
  state.selectedIndex = 0;
  updateAll();
}

function goBack() {
  if (state.navStack.length > 0) {
    state.navStack.pop();
    state.selectedIndex = 0;
    updateAll();
  }
}

function expandAll() {
  // No-op in simulation—just a visual cue
}

function collapseAll() {
  state.navStack = [];
  state.selectedIndex = 0;
  state.searchQuery = '';
  document.getElementById('globalSearch').value = '';
  updateAll();
}

function copyPrompt() {
  const el = document.getElementById('promptBody');
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// ═══════════════════════════════════════════════════
// KEYBOARD NAV
// ═══════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const items = filteredItems();

  switch(e.key) {
    case 'ArrowDown':
      e.preventDefault();
      state.selectedIndex = Math.min(state.selectedIndex + 1, items.length - 1);
      renderContent();
      updatePrompt();
      scrollToSelected();
      break;
    case 'ArrowUp':
      e.preventDefault();
      state.selectedIndex = Math.max(state.selectedIndex - 1, 0);
      renderContent();
      updatePrompt();
      scrollToSelected();
      break;
    case 'Enter':
    case 'ArrowRight':
      e.preventDefault();
      activateEntry(state.selectedIndex);
      break;
    case 'Backspace':
    case 'ArrowLeft':
      e.preventDefault();
      goBack();
      break;
    case 'Tab':
      e.preventDefault();
      const tabs = Object.keys(MENU_DATA);
      const ci = tabs.indexOf(state.activeTab);
      const ni = e.shiftKey
        ? (ci - 1 + tabs.length) % tabs.length
        : (ci + 1) % tabs.length;
      selectTab(tabs[ni]);
      break;
  }
});

function scrollToSelected() {
  const el = document.querySelector('.content-entry.selected');
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// Search
document.getElementById('globalSearch').addEventListener('input', (e) => {
  state.searchQuery = e.target.value;
  state.selectedIndex = 0;
  renderContent();
  updatePrompt();
});

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('headerClock').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 30000);

// Init
updateAll();
</script>
